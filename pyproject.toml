[project]
name = "repo-archaeologist"
version = "0.1.0"
description = "Ask why code is the way it is. Reconstructs intent from git blame, commits, PR review threads and linked issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40", "requests>=2.31"]

[project.scripts]
archaeo = "archaeo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archaeo", "archaeo.tools"]
